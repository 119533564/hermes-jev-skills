name: hermes-jev
version: 0.1.0
description: TypeSafe Jev takes the cheap decisions - model routing, skill selection, memory filtering, compaction selection, GUI and browser action choice.
author: Steve Darlow
license: MIT
homepage: https://github.com/kerpopule/hermes-jev-skills
manifest_version: 2
requires_env:
  - TYPESAFE_API_KEY
provides_tools:
  - jev_memory_filter
  - jev_compact_select
  - jev_choose_action
provides_hooks:
  - pre_llm_call
  - transform_llm_output
tags: [jev, typesafe, routing, memory, compaction, computer-use]
config_schema:
  type: object
  properties:
    routing: {type: string, enum: ["off", "shadow", "on"], default: "off"}
    skills: {type: string, enum: ["off", "on"], default: "off"}
    notice: {type: string, enum: ["off", "on"], default: "off"}
